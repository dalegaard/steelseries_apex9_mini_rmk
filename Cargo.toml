[package]
name = "steelseries_apex9_mini_rmk"
version = "0.1.0"
authors = ["Lasse Dalegaard <dalegaard@gmail.com>"]
description = "SteelSeries™ Apex 9 Mini keyboard firmware"
repository = "https://github.com/dalegaard/steelseries_apex9_mini_rmk"
readme = "README.md"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rmk = { git = "https://github.com/rmk-rs/rmk", default-features = false }
cortex-m = { version = "0.7", features = ['critical-section-single-core'] }
cortex-m-rt = "0.7"
embedded-hal-async = { version = "1", features = ["defmt-03"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt"] }
embassy-stm32 = { version = "0.6", features = [
  "stm32l412rb",
  "defmt",
  "memory-x",
  "exti",
  "time-driver-any",
] }
embassy-executor = { version = "0.10", features = [
  "defmt",
  "platform-cortex-m",
  "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
bytemuck = "1"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "steelseries_apex9_mini_rmk"
test = false
bench = false

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
